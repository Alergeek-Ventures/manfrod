name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Same paradedb image as deployment/local/compose.yml — plain postgres
      # lacks the pgvector/pg_search extensions the migrations require.
      DATABASE_URL: postgres://manfrod:manfrod@localhost:5432/manfrod_test
      TEST_DATABASE_URL: postgres://manfrod:manfrod@localhost:5432/manfrod_test
    services:
      postgres:
        image: docker.io/paradedb/paradedb@sha256:17fbec03c8543eb12267edb06345779f239505654609c4376ade53b4ec4ad1e9
        env:
          POSTGRES_USER: manfrod
          POSTGRES_PASSWORD: manfrod
          POSTGRES_DB: manfrod_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U manfrod"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up tools
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4

      - name: Cache pnpm store
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-${{ hashFiles('mise.toml', 'pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrate database
        run: node scripts/migrate.mjs

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build
