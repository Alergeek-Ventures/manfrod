name: Deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Checkout coolify deploy action
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: Alergeek-Ventures/av-secret-service
          ref: 13a0cb7f696276d6fce61f0459d3d2dc001bbb32
          ssh-key: ${{ secrets.AV_SECRET_SERVICE_DEPLOY_KEY }}
          path: .github/actions/av-secret-service
          persist-credentials: false

      - name: Set APP_COMMIT in Coolify
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ vars.COOLIFY_APP_UUID }}
          APP_COMMIT: ${{ github.sha }}
        run: |
          body=$(jq -n --arg value "$APP_COMMIT" '{key: "APP_COMMIT", value: $value, is_literal: true}')
          send() {
            curl -sS -o /tmp/coolify-env.json -w '%{http_code}' -X "$1" \
              "https://coolify.alergeek.me/api/v1/applications/${COOLIFY_APP_UUID}/envs" \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
              -H "Content-Type: application/json" \
              --data "$body"
          }
          status=$(send PATCH)
          if [[ "$status" == 404 ]]; then status=$(send POST); fi
          if [[ "$status" != 2* ]]; then
            echo "Coolify returned HTTP $status"
            cat /tmp/coolify-env.json
            exit 1
          fi

      - name: Deploy to Coolify
        uses: ./.github/actions/av-secret-service/coolify-deploy
        with:
          infisical-identity-id: ${{ vars.INFISICAL_MACHINE_IDENTITY_ID }}
          infisical-project-slug: manfrod
          coolify-token: ${{ secrets.COOLIFY_TOKEN }}
          coolify-app-uuid: ${{ vars.COOLIFY_APP_UUID }}
          print-logs: false
