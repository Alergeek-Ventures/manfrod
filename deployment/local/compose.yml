services:
  postgres:
    image: docker.io/paradedb/paradedb@sha256:17fbec03c8543eb12267edb06345779f239505654609c4376ade53b4ec4ad1e9
    container_name: manfrod-db
    environment:
      POSTGRES_USER: manfrod
      POSTGRES_PASSWORD: qLmVMeXiYyy65ADb
    ports:
      - "35232:5432"
    volumes:
      - manfrod_data:/var/lib/postgresql

  inngest:
    image: docker.io/inngest/inngest@sha256:7a24ef43322e222c00ebf58d57edb2cf1563e59d92a9d556c3ed380969565b28
    container_name: manfrod-inngest
    command: ["inngest", "dev", "-u", "http://host.docker.internal:3000/api/inngest", "--no-discovery"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8288:8288"

volumes:
  manfrod_data:
